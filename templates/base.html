<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Expense Tracker{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="/static/style.css" />

  {% block head %}{% endblock %}
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">₹</span>
    <span class="logo-text">SpendWise</span>
  </div>

  <nav class="sidebar-nav">
    <a href="/"          class="nav-link {% if active=='home'      %}active{% endif %}">
      <span class="nav-icon">🏠</span> <span>Overview</span>
    </a>
    <a href="/dashboard" class="nav-link {% if active=='dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span> <span>Dashboard</span>
    </a>
    <a href="/history"   class="nav-link {% if active=='history'   %}active{% endif %}">
      <span class="nav-icon">📋</span> <span>History</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <p>Single-user mode</p>
    <p class="sidebar-version">v1.0</p>
  </div>
</aside>

<header class="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <span class="topbar-title">{% block topbar_title %}SpendWise{% endblock %}</span>
</header>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="expenseModal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Expense</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <form id="expenseForm" novalidate>
        <input type="hidden" id="expenseId" />

        <div class="form-row">
          <div class="form-group">
            <label for="expAmount">Amount (₹)</label>
            <input type="number" id="expAmount" placeholder="0.00" min="1" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="expDate">Date</label>
            <input type="date" id="expDate" required />
          </div>
        </div>

        <div class="form-group">
          <label for="expCategory">Category</label>
          <select id="expCategory" required>
            <option value="">Select category…</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expDesc">Description <span class="optional">(optional)</span></label>
          <textarea id="expDesc" rows="3" placeholder="What did you spend on?"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Expense</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
